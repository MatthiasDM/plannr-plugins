[package]
name = "plannr-plugin-plumbing"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Plannr plumbing plugin: pipes (Alupex, PEX, copper, PVC, PE, steel) with bends or elbows, press / clamp / solder / glue fittings, mixers, valves, manifolds, brackets, checks and a material takeoff"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
plannr-core = { path = "../../plannr/crates/plannr-core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
plannr-plugin-construction = { path = "../../construction/engine" }
