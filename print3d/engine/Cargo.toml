[package]
name = "plannr-plugin-print3d"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "Plannr 3D print plugin: exports solids as STL / 3MF in millimetres, checks they are watertight, repairs small defects and lays objects out on the build plate"

[lib]
path = "src/lib.rs"
# rlib for tests and native use, cdylib for the installable WebAssembly engine (wasm32-wasip1)
crate-type = ["rlib", "cdylib"]

[dependencies]
plannr-core = { path = "../../plannr/crates/plannr-core" }
serde.workspace = true
serde_json.workspace = true
