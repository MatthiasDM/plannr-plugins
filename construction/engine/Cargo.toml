[package]
name = "plannr-plugin-construction"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Plannr construction plugin: storeys, rooms, walls, openings, roofs, fixtures and runs, built as Belgian masonry (cavity walls, potten en balken / welfsels floors) with takeoff, checks and U-values"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
plannr-core = { path = "../../plannr/crates/plannr-core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
boa_engine = { version = "0.22", default-features = false }

[dev-dependencies]
plannr-plugin-framing = { path = "../../framing/engine" }

[features]
# set by plugins that use this crate as a library: leaves out its WebAssembly exports
embedded = []
