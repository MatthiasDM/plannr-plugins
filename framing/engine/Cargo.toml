[package]
name = "plannr-plugin-framing"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Plannr framing plugin: Medeek-style parametric wood framing (stud walls with openings, floor joists, roof trusses and rafters, foundations) with a material takeoff"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
plannr-core = { path = "../../plannr/crates/plannr-core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
plannr-plugin-construction = { path = "../../construction/engine" }
